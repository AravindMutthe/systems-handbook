<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark';}catch(e){}</script>
<title>Explore domain — Systems Evolution</title>
<style>body{font-family:system-ui,sans-serif;background:#fdfbf7;color:#1a2027;margin:0;padding:0}
main{max-width:960px;margin:0 auto;background:#fdfbf7;color:#1a2027;border-radius:0;padding:0 18px 24px}
.eyebrow{color:#8a6d1b;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;margin:0 0 8px}
h1{font-family:Georgia,serif;font-size:32px;line-height:1.15;margin:0 0 8px}
.lede{color:#555;font-size:16px;line-height:1.6}
a.home{display:inline-flex;align-items:center;gap:10px;border:1px solid #e6ddd0;border-radius:999px;padding:8px 16px;text-decoration:none;color:#1a2027;font-weight:700;margin:8px 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;background:#fff;border:1px solid #e6ddd0;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-cover{position:relative;aspect-ratio:1/1;overflow:hidden;background:#f5ecd4}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block}
.card-number{position:absolute;top:8px;right:12px;z-index:2;font-family:Georgia,serif;font-size:36px;font-weight:700;line-height:1;color:#1a2027;opacity:.18}
.card-body{padding:14px}
.card-body h4{margin:0 0 6px;font-size:17px;line-height:1.3}
.card-body p{color:#555;font-size:14px;margin:0 0 8px;line-height:1.5}
.key-headline{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a6d1b;font-weight:700;margin:12px 0 4px!important}
.key-points{list-style:none;margin:0;padding:0}
.key-points li{font-size:13px;color:#5b6770;padding-left:14px;position:relative;margin-bottom:4px;line-height:1.5}
.key-points li::before{content:"•";position:absolute;left:0;color:#d9a441;font-weight:700}
li strong{font-weight:800;color:#111827}
strong em, em strong{font-style:italic;font-weight:800}
.cross-term{font-weight:800;color:#8a6d1b}
.badge{display:inline-block;background:#f5ecd4;color:#8a6d1b;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:8px}.badge-new{background:#1f2a33;color:#fdfbf7}
.empty{color:#555;border:1px dashed #e6ddd0;border-radius:12px;padding:20px}
.theme-toggle{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:#ffffff;color:#1a2027;border:1px solid #e6ddd0;font-size:24px;cursor:pointer;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
[data-theme="dark"] body,[data-theme="dark"] main,[data-theme="dark"] .site-header{background:#10181e;color:#fdfbf7}
[data-theme="dark"] .site-brand,[data-theme="dark"] .back,[data-theme="dark"] .home,[data-theme="dark"] .nav a,[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3,[data-theme="dark"] li strong,[data-theme="dark"] .cardlist a,[data-theme="dark"] .card-body h4{color:#fdfbf7}
[data-theme="dark"] .lede,[data-theme="dark"] .meta,[data-theme="dark"] figcaption,[data-theme="dark"] .site-brand small,[data-theme="dark"] .card-body p,[data-theme="dark"] .empty{color:#cbd5e1}
[data-theme="dark"] .eyebrow,[data-theme="dark"] .cross-term,[data-theme="dark"] .key-headline,[data-theme="dark"] .badge{color:#d9a441}
[data-theme="dark"] .added{background:#26343f}
[data-theme="dark"] h2,[data-theme="dark"] .nav,[data-theme="dark"] details,[data-theme="dark"] .site-header{border-color:#33424e}
[data-theme="dark"] .theme-toggle{background:#1f2a33;color:#fdfbf7;border-color:#33424e}
[data-theme="dark"] .card{background:#1f2a33;border-color:#33424e}
[data-theme="dark"] figure img{border-color:#33424e!important}
</style>
</head>
<body>
<main>
<p class="eyebrow">Systems Evolution</p>
<h1 id="title">Exploring domain</h1>
<p class="lede" id="lede">Cards in learning order, flat grid — all cards visible, not nested cards.</p>
<a class="home" href="index.html">← Back to homepage</a>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden>No cards in this domain yet — they will appear here as you send them.</p>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boldLead = k => { const e = esc(k); for (const sep of [': ', ' = ', ' — ']) { const i = e.indexOf(sep); if (i >= 3 && i <= 60) return `<strong>${e.slice(0, i + sep.length).trimEnd()}</strong>${e.slice(i + sep.length)}`; } return e; };
const italicBold = s => { const names = 'Ciudad del Carmen|Broadcom|Verizon|Lenovo|Nvidia|Intel|Dell|Cisco|AT&T|Jio|AWS|GCP|DARPA|ARPANET|IETF|IEEE|3GPP|FCC|TRAI|ICANN|ARIN|RIPE|APNIC|DRDO|NASA|India|USA|Internet|HPE|Nginx|Apache'; return s.split(/(<strong>.*?<\/strong>)/g).map(seg => seg.startsWith('<strong>') ? seg.replace(new RegExp('\\b(' + names + ')\\b', 'g'), '<em>$1</em>') : seg.replace(new RegExp('\\b(' + names + ')\\b', 'g'), '<strong><em>$1</em></strong>')).join(''); };
const crossTerm = s => { const terms = 'trading speed|data lane|management lane|kernel stack|signalling|directory|endpoint|hierarchy|hierarchical|allocation|regulation|coordination|trading|business|market|customer|vendor|company|approval|network|product|silicon|stack|lane|gate'; return s.split(/(<strong>.*?<\/strong>|<strong><em>.*?<\/em><\/strong>)/g).map(seg => (seg.startsWith('<strong>') ? seg : seg.replace(new RegExp('\\b(' + terms + ')\\b', 'gi'), '<span class="cross-term">$1</span>'))).join(''); };
const fmt = k => crossTerm(italicBold(boldLead(k)));
(async () => {
  const params = new URLSearchParams(location.search);
  const domainId = params.get('domain') || '';
  const [cats, content] = await Promise.all([
    fetch('categories.json').then(r => r.json()).catch(() => []),
    fetch('content.json').then(r => r.json()).catch(() => ({notes: []}))
  ]);
  const cat = cats.find(c => c.id === domainId) || {id: domainId, title: domainId, emoji: '📄'};
  document.getElementById('title').textContent = `Exploring: ${cat.title}`;
  const notes = (content.notes || []).filter(n => n.privacy === 'public' && ((n.publication && n.publication.status === 'published') || n.reviewStatus === 'published'));
  // All cards for this domain, in learning order (notes array order = Card A … Card E), flat grid, not nested.
  const pages = notes.filter(n => (n.domain === cat.id || n.domain === cat.title || (Array.isArray(n.relatedDomains) && n.relatedDomains.includes(cat.id))));
  const grid = document.getElementById('grid');
  if (!pages.length) { document.getElementById('empty').hidden = false; return; }
  pages.forEach(n => {
    const seq = String(notes.indexOf(n) + 1).padStart(2, '0');
    const isRelated = (n.domain !== cat.id && n.domain !== cat.title);
    // Headline only, no content: badge, title split at colon, primary domain topic. No key points, no poster, no body text.
    const ti = n.title.indexOf(':');
    const headMain = ti > 0 ? n.title.slice(0, ti + 1) : n.title;
    const headRest = ti > 0 ? n.title.slice(ti + 1).trim() : '';
    const btn = document.createElement('button'); btn.className = 'card';
    btn.innerHTML = `<span class="card-number" aria-hidden="true">${seq}</span><div class="card-body">${isRelated ? '<span class="badge">RELATED</span>' : ''}${n.isNew ? '<span class="badge badge-new">NEW</span>' : ''}<h4>${esc(headMain)}<br>${esc(headRest)}</h4><p>${esc(n.topic || cat.title)}</p></div>`;
    btn.onclick = () => { if (n.page) location.href = n.page; };
    grid.appendChild(btn);
  });
})();
</script>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark and light theme">☀️</button><script>(function(){var b=document.getElementById('theme-toggle');function setBtn(){b.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';}setBtn();b.onclick=function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n);}catch(e){}setBtn();};})();</script>
</body>
</html>
