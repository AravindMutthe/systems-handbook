<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" role="img" aria-label="How the interface changed flow"><rect width="900" height="638" fill="#F8FAFC"/><text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#1F2A33">How the interface changed — in order</text><rect x="40" y="56" width="820" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="40" y="56" width="8" height="76" rx="4" fill="#D9A441"/><circle cx="92" cy="94" r="22" fill="#1F2A33"/><text x="92" y="101" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#D9A441">1</text><text x="132" y="88" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#1F2A33">Telegraph keys</text><text x="132" y="114" font-family="Georgia,serif" font-size="15" fill="#5B6B76">A key, a wire, a message</text><path d="M450 132 L450 160 M438 152 L450 164 L462 152" fill="none" stroke="#D9A441" stroke-width="3"/><rect x="470" y="136" width="105" height="22" rx="11" fill="#FFF7E0" stroke="#D9A441"/><text x="482" y="152" font-family="Georgia,serif" font-size="13" fill="#7A5A12">replaced by</text><rect x="40" y="174" width="820" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="40" y="174" width="8" height="76" rx="4" fill="#D9A441"/><circle cx="92" cy="212" r="22" fill="#1F2A33"/><text x="92" y="219" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#D9A441">2</text><text x="132" y="206" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#1F2A33">Desktop screens</text><text x="132" y="232" font-family="Georgia,serif" font-size="15" fill="#5B6B76">Windows, mouse, menus</text><path d="M450 250 L450 278 M438 270 L450 282 L462 270" fill="none" stroke="#D9A441" stroke-width="3"/><rect x="470" y="254" width="91" height="22" rx="11" fill="#FFF7E0" stroke="#D9A441"/><text x="482" y="270" font-family="Georgia,serif" font-size="13" fill="#7A5A12">opened to</text><rect x="40" y="292" width="820" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="40" y="292" width="8" height="76" rx="4" fill="#D9A441"/><circle cx="92" cy="330" r="22" fill="#1F2A33"/><text x="92" y="337" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#D9A441">3</text><text x="132" y="324" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#1F2A33">Web browsers</text><text x="132" y="350" font-family="Georgia,serif" font-size="15" fill="#5B6B76">Any page, any computer</text><path d="M450 368 L450 396 M438 388 L450 400 L462 388" fill="none" stroke="#D9A441" stroke-width="3"/><rect x="470" y="372" width="98" height="22" rx="11" fill="#FFF7E0" stroke="#D9A441"/><text x="482" y="388" font-family="Georgia,serif" font-size="13" fill="#7A5A12">carried to</text><rect x="40" y="410" width="820" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="40" y="410" width="8" height="76" rx="4" fill="#D9A441"/><circle cx="92" cy="448" r="22" fill="#1F2A33"/><text x="92" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#D9A441">4</text><text x="132" y="442" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#1F2A33">Mobile in the hand</text><text x="132" y="468" font-family="Georgia,serif" font-size="15" fill="#5B6B76">Touch, apps, everywhere</text><path d="M450 486 L450 514 M438 506 L450 518 L462 506" fill="none" stroke="#D9A441" stroke-width="3"/><rect x="470" y="490" width="133" height="22" rx="11" fill="#FFF7E0" stroke="#D9A441"/><text x="482" y="506" font-family="Georgia,serif" font-size="13" fill="#7A5A12">made instant by</text><rect x="40" y="528" width="820" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="40" y="528" width="8" height="76" rx="4" fill="#D9A441"/><circle cx="92" cy="566" r="22" fill="#1F2A33"/><text x="92" y="573" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#D9A441">5</text><text x="132" y="560" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#1F2A33">Real-time, XR and AI interfaces</text><text x="132" y="586" font-family="Georgia,serif" font-size="15" fill="#5B6B76">Live, immersive, conversational</text></svg>