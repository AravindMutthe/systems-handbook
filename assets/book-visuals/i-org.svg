<rect x="20" y="550" width="720" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="20" y="550" width="6" height="86" rx="3" fill="#D9A441"/>
<circle cx="54" cy="593" r="18" fill="#10233F"/><text x="54" y="599" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
<text x="84" y="576" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8A6D1B">5G &amp; AI</text>
<text x="84" y="600" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1E293B">AI / platform / data / edge teams</text>
<text x="84" y="618" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1E293B">under central company rules</text>
<text x="84" y="638" font-family="system-ui,sans-serif" font-size="13" fill="#64748B">Distributed edge, central rules</text>
</svg>